apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carbonverify-deny-all
  namespace: carbonverify
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carbonverify-app-ingress
  namespace: carbonverify
spec:
  podSelector:
    matchLabels:
      app: carbonverify-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carbonverify-app-egress
  namespace: carbonverify
spec:
  podSelector:
    matchLabels:
      app: carbonverify-app
  policyTypes:
    - Egress
  egress:
    # DNS resolution (required even for cluster-local names)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL — adjust CIDR if using managed RDS/Cloud SQL
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    # Redis — adjust CIDR if using managed ElastiCache/Memorystore
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
    # External HTTPS APIs (S3, SES, registry APIs, Radix, SIEM, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carbonverify-celery-egress
  namespace: carbonverify
spec:
  podSelector:
    matchLabels:
      app: carbonverify-celery-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carbonverify-beat-egress
  namespace: carbonverify
spec:
  podSelector:
    matchLabels:
      app: carbonverify-celery-beat
  policyTypes:
