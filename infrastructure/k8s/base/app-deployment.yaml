apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonverify-app
  namespace: carbonverify
  labels:
    app: carbonverify-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: carbonverify-app
  template:
    metadata:
      labels:
        app: carbonverify-app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - carbonverify-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: <ECR_REGISTRY>/carbonverify-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: carbonverify-config
            - secretRef:
                name: carbonverify-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: carbonverify-app
  namespace: carbonverify
  labels:
    app: carbonverify-app
spec:
  type: ClusterIP
  selector:
    app: carbonverify-app
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: carbonverify-app-pdb
  namespace: carbonverify
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: carbonverify-app
