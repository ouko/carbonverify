apiVersion: v1
kind: Secret
metadata:
  name: carbonverify-secrets
  namespace: carbonverify-staging
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://<DB_USER>:<DB_PASSWORD>@postgres-staging:5432/carbonverify"
  REDIS_URL: "redis://redis-staging:6379/0"
  SECRET_KEY: "<JWT_SECRET_KEY_STAGING>"
  AWS_ACCESS_KEY_ID: "<AWS_ACCESS_KEY_ID>"
  AWS_SECRET_ACCESS_KEY: "<AWS_SECRET_ACCESS_KEY>"
  RADIX_PRIVATE_KEY_HEX: "<RADIX_PRIVATE_KEY_HEX>"
  ENCRYPTION_KEY_HEX: "<ENCRYPTION_KEY_HEX>"
  KIMI_API_KEY: "<KIMI_API_KEY>"
