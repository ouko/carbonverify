version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do not expose DB port to host in production
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carbonverify} -d ${POSTGRES_DB:-carbonverify}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Do not expose Redis port to host in production
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-app
    restart: unless-stopped
    command: >
      sh -c "
        alembic upgrade head &&
        gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
      "
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
      - FRONTEND_URL=${FRONTEND_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY_HEX=${ENCRYPTION_KEY_HEX}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    # Dev volume mount for hot reload — remove in production
    volumes:
      - ./backend:/app
    networks:
      default: {}
      # Fixed IP on the proxy network so the managed nginx upstreams never
      # go stale when this container is recreated.
      proxy:
        ipv4_address: 192.168.100.10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY_HEX=${ENCRYPTION_KEY_HEX}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY_HEX=${ENCRYPTION_KEY_HEX}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  clamav:
    image: clamav/clamav:latest
    container_name: cv-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    # Do not expose port to host in production
    # ports:
    #   - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_WS_URL=${VITE_WS_URL:-}
    container_name: cv-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/nginx/frontend-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default: {}
      proxy:
        ipv4_address: 192.168.100.11

  # Reverse proxy for carbonverify.space (and the other sites defined in
  # infrastructure/nginx/nginx.conf). Managed by compose so it is recreated
  # with the stack; upstreams use the fixed proxy-network IPs, so routing
  # survives app/frontend recreation without a manual restart.
  nginx:
    image: nginx:1.25-alpine
    container_name: cv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/carbonverify.space/fullchain.pem:/etc/nginx/cert.pem:ro
      - /etc/letsencrypt/live/carbonverify.space/privkey.pem:/etc/nginx/key.pem:ro
      - /etc/letsencrypt/live/afrobeats.space/fullchain.pem:/etc/letsencrypt/live/afrobeats.space/fullchain.pem:ro
      - /etc/letsencrypt/live/afrobeats.space/privkey.pem:/etc/letsencrypt/live/afrobeats.space/privkey.pem:ro
      - /etc/letsencrypt/live/vibe2.afrobeats.space/fullchain.pem:/etc/letsencrypt/live/vibe2.afrobeats.space/fullchain.pem:ro
      - /etc/letsencrypt/live/vibe2.afrobeats.space/privkey.pem:/etc/letsencrypt/live/vibe2.afrobeats.space/privkey.pem:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  # Dedicated network for nginx → app/frontend with fixed IPs (see the
  # ipv4_address assignments). Chosen from 192.168.100.0/24 to avoid
  # clashing with Docker's default 172.x address pools.
  proxy:
    ipam:
      config:
        - subnet: 192.168.100.0/24
          ip_range: 192.168.100.0/24

volumes:
  postgres_data:
  redis_data:
  clamav_data:
