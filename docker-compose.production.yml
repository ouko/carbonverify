services:
  db:
    image: postgres:15-alpine
    container_name: cv-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-carbonverify} -d ${POSTGRES_DB:-carbonverify}
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: cv-redis
    restart: always
    command: 'redis-server --appendonly yes --aof-use-rdb-preamble yes --maxmemory
      512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD
      is required}

      '
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-app
    restart: always
    command: sh -c "alembic upgrade head && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000 --access-logfile - --error-logfile - --timeout 60 --keep-alive
      5 --max-requests 10000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      FRONTEND_URL: ${FRONTEND_URL}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-celery-worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
      --without-gossip --without-mingle --without-heartbeat
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cv-celery-beat
    restart: always
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler app.tasks.beat_scheduler.LeaderElectionScheduler
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: cv-frontend
    restart: always
    environment:
    - NODE_ENV=production
    volumes:
    - ./infrastructure/nginx/frontend-nginx.conf:/etc/nginx/nginx.conf:ro
  nginx:
    image: nginx:1.25-alpine
    container_name: cv-nginx
    restart: always
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt/live/carbonverify.space/fullchain.pem:/etc/nginx/cert.pem:ro
    - /etc/letsencrypt/live/carbonverify.space/privkey.pem:/etc/nginx/key.pem:ro
    depends_on:
    - app
    - frontend
volumes:
  postgres_data: null
  redis_data: null
  clamav_data: null
