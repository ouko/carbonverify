# Docker Compose override for security scanning in CI.
# Layers on top of docker-compose.yml and exposes the API port so ZAP can reach it.
# Usage: docker compose -f docker-compose.yml -f docker-compose.security-scan.yml up -d --build db redis app
# (nginx is intentionally NOT started: it bind-mounts host TLS certificates
# that do not exist in CI, and celery/clamav/frontend are irrelevant to the scan.)

services:
  app:
    ports:
      - "8000:8000"

  nginx:
    ports:
      - "80:80"
