name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: carbonverify-app
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      - name: Run Ruff
        run: |
          uv pip install ruff --system
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run MyPy
        run: |
          uv pip install mypy --system
          mypy app/ --ignore-missing-imports

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: carbonverify
          POSTGRES_PASSWORD: carbonverify_secret
          POSTGRES_DB: carbonverify_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://carbonverify:carbonverify_secret@localhost:5432/carbonverify_test
        run: alembic upgrade head

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://carbonverify:carbonverify_secret@localhost:5432/carbonverify_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          uv pip install pytest pytest-asyncio pytest-cov httpx --system
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --coverage --watchAll=false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          flags: frontend
          name: frontend-coverage

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging-latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/carbonverify-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/carbonverify-frontend:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging-latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-app.carbonverify.io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name carbonverify-staging --region ${{ env.AWS_REGION }}

      - name: Deploy to staging
        run: |
          cd infrastructure/k8s/overlays/staging
          kustomize edit set image <ECR_REGISTRY>/carbonverify-app=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging-latest
          kustomize edit set image <ECR_REGISTRY>/carbonverify-frontend=${{ steps.login-ecr.outputs.registry }}/carbonverify-frontend:staging-latest
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/staging-carbonverify-app -n carbonverify-staging --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl wait --for=condition=ready pod -l app=carbonverify-app -n carbonverify-staging --timeout=300s

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Install Newman
        run: npm install -g newman

      - name: Wait for staging
        run: sleep 60

      - name: Run Postman collection
        run: |
          newman run infrastructure/tests/integration/carbonverify-api.json \
            --environment infrastructure/tests/integration/staging-env.json \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: newman-report.xml

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.carbonverify.io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name carbonverify-production --region ${{ env.AWS_REGION }}

      - name: Deploy to production
        run: |
          cd infrastructure/k8s/overlays/production
          kustomize edit set image <ECR_REGISTRY>/carbonverify-app=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          kustomize edit set image <ECR_REGISTRY>/carbonverify-frontend=${{ steps.login-ecr.outputs.registry }}/carbonverify-frontend:latest
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/prod-carbonverify-app -n carbonverify --timeout=600s

      - name: Verify deployment health
        run: |
          kubectl wait --for=condition=ready pod -l app=carbonverify-app -n carbonverify --timeout=300s

      - name: Run smoke tests
        run: |
          curl -sf https://api.carbonverify.io/health || exit 1
          curl -sf https://app.carbonverify.io || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/prod-carbonverify-app -n carbonverify
          kubectl rollout undo deployment/prod-carbonverify-celery-worker -n carbonverify
          kubectl rollout undo deployment/prod-carbonverify-celery-beat -n carbonverify
          kubectl rollout status deployment/prod-carbonverify-app -n carbonverify --timeout=300s
