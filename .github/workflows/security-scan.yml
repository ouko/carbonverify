name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    env:
      # Deterministic CI-only values for the throwaway scan stack. SECRET_KEY
      # is the JWT signing key (min 32 chars) and ENCRYPTION_KEY_HEX is the
      # PII field-encryption key (exactly 64 hex chars, enforced at boot in
      # production mode). Never use these outside CI.
      ENVIRONMENT: production
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENCRYPTION_KEY_HEX: 05c7538ccb28a4b774c6a683a980c96bb584c38a8df0f84faf603165aee2190b
      POSTGRES_USER: carbonverify
      POSTGRES_PASSWORD: ci-test-postgres-password-not-secret
      POSTGRES_DB: carbonverify
      DATABASE_URL: postgresql+asyncpg://carbonverify:ci-test-postgres-password-not-secret@db:5432/carbonverify
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AWS_ACCESS_KEY_ID: ci-test-aws-access-key
      AWS_SECRET_ACCESS_KEY: ci-test-aws-secret-key-not-secret
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: ci-test-bucket
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: '15'
      REFRESH_TOKEN_EXPIRE_DAYS: '7'
      LOG_LEVEL: INFO
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          # Base compose file + security-scan override, targeting only the
          # services ZAP needs. The old combo (production + security-scan)
          # was invalid: production redefines the services so the base nginx
          # is absent, while the override re-adds an nginx with no image.
          # The base nginx also bind-mounts host TLS certs that don't exist
          # in CI, and celery/clamav/frontend are irrelevant to the scan.
          docker compose -f docker-compose.yml -f docker-compose.security-scan.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.security-scan.yml up -d --build db redis app
          # The app runs `alembic upgrade head` before gunicorn starts, so
          # poll /health/ (30 x 5s = 150s max) instead of a fixed sleep.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy in time"
          docker compose -f docker-compose.yml -f docker-compose.security-scan.yml logs app
          exit 1

      - name: ZAP Baseline Scan
        # Run ZAP directly: the zaproxy/*-scan actions embed the retired
        # @actions/artifact v1 client, whose Create-Artifact-Container API
        # GitHub no longer accepts (any name fails), killing the step after
        # the scan. The docker invocation below is the exact command the
        # action constructed; exit code still reflects FAIL/WARN findings
        # via .zap/rules.tsv, and reports are uploaded by the next step.
        run: |
          docker run -v "${{ github.workspace }}:/zap/wrk/:rw" --network=host -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8000 -r report_html.html -w report_md.md -J report_json.json -a -c .zap/rules.tsv

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json

  zap-api:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    env:
      # Same deterministic CI-only values as zap-baseline (see that job).
      ENVIRONMENT: production
      SECRET_KEY: ci-test-secret-key-not-for-production
      ENCRYPTION_KEY_HEX: 05c7538ccb28a4b774c6a683a980c96bb584c38a8df0f84faf603165aee2190b
      POSTGRES_USER: carbonverify
      POSTGRES_PASSWORD: ci-test-postgres-password-not-secret
      POSTGRES_DB: carbonverify
      DATABASE_URL: postgresql+asyncpg://carbonverify:ci-test-postgres-password-not-secret@db:5432/carbonverify
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      AWS_ACCESS_KEY_ID: ci-test-aws-access-key
      AWS_SECRET_ACCESS_KEY: ci-test-aws-secret-key-not-secret
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: ci-test-bucket
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: '15'
      REFRESH_TOKEN_EXPIRE_DAYS: '7'
      LOG_LEVEL: INFO
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          # Base compose file + security-scan override, targeting only the
          # services ZAP needs. The old combo (production + security-scan)
          # was invalid: production redefines the services so the base nginx
          # is absent, while the override re-adds an nginx with no image.
          # The base nginx also bind-mounts host TLS certs that don't exist
          # in CI, and celery/clamav/frontend are irrelevant to the scan.
          docker compose -f docker-compose.yml -f docker-compose.security-scan.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.security-scan.yml up -d --build db redis app
          # The app runs `alembic upgrade head` before gunicorn starts, so
          # poll /health/ (30 x 5s = 150s max) instead of a fixed sleep.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ > /dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy in time"
          docker compose -f docker-compose.yml -f docker-compose.security-scan.yml logs app
          exit 1

      - name: ZAP API Scan
        # Direct docker run — same rationale as the baseline job (the
        # zaproxy/action-api-scan artifact upload uses the retired v1 API).
        run: |
          docker run -v "${{ github.workspace }}:/zap/wrk/:rw" --network=host -t ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi -r report_html.html -w report_md.md -J report_json.json -a -c .zap/rules.tsv

      - name: Upload ZAP API report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report
          path: |
            report_html.html
            report_json.json

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install safety bandit

      - name: Run Safety check
        run: |
          cd backend
          # All 109 previously-reported vulnerabilities are fixed by upgrading
          # (see backend/requirements.txt); no --ignore-ids needed.
          safety check -r requirements.txt

      - name: Run Bandit
        run: |
          cd backend
          # Always produce the full JSON report for the artifact, but don't let
          # Low-severity findings fail the step (--exit-zero). The real gate is
          # the second pass: `-ll` reports only Medium+ severity, so any
          # Medium/High finding exits non-zero and fails the job.
          bandit -r app/ -f json -o bandit-report.json --exit-zero
          bandit -r app/ -ll -q

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
